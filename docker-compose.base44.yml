services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DISABLE_HMR=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    restart: unless-stopped
